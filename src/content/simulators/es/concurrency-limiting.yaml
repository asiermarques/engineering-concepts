# Written by Claude from the original Static walkthrough; pending technical review by the Author.
concept: concurrency-limiting
caption: "Un semáforo con 3 permisos y 7 peticiones simultáneas: 3 se ejecutan y las otras 4 esperan o se rechazan, según la política."
actors:
  - "Peticiones 1–3"
  - "Peticiones 4–7"
  - "Semáforo (3 permisos)"
steps:
  - cells: ["llegan", "llegan", "3 de 3 libres"]
    state: "Permisos libres: 3 de 3. En ejecución: 0. En espera: 0."
    note: "Llegan 7 peticiones a la vez; el semáforo deja ejecutar como máximo 3 al mismo tiempo."
  - cells: ["acquire() → concedido, se ejecutan", "acquire() → sin permiso: esperan, o tryAcquire() → rechazadas", "0 de 3 libres"]
    state: "Permisos libres: 0 de 3. En ejecución: 3. Sobran 4 (en espera: 4 con acquire(), o rechazadas: 4 con tryAcquire())."
    note: "La política decide qué pasa con el exceso: acquire() espera un permiso; tryAcquire() falla al momento para que quien llama pueda rechazar la petición."
  - cells: ["la petición 1 termina y llama a release()", "", "1 de 3 libres"]
    state: "Permisos libres: 1 de 3. En ejecución: 2. En espera: 4 (con acquire())."
    note: "Libera en un bloque finally: un permiso que nunca se devuelve se pierde para siempre."
  - cells: ["", "la petición 4 toma el permiso libre y se ejecuta", "0 de 3 libres"]
    state: "Permisos libres: 0 de 3. En ejecución: 3. En espera: 3 (con acquire())."
